# Expose folder api/ yang berada di luar DocumentRoot (/app/public)
Alias /api /app/api

<Directory "/app/api">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Delegasi eksekusi file PHP ke PHP-FPM FastCGI proxy
    <FilesMatch "\.php$">
        <If "-f %{REQUEST_FILENAME}">
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </If>
    </FilesMatch>
</Directory>

<Directory "/app/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
