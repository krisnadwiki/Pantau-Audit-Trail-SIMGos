# ========================================================
# PANTAU - Hardened Apache VirtualHost Configuration
# ========================================================

# 1. Server Banner & Info Obfuscation
ServerSignature Off
ServerTokens Prod

# 2. HTTP Security Headers
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
</IfModule>

# 3. Global File Restrictions (Block Hidden Files, Backups, and Credentials)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<FilesMatch "(?i)\.(bak|old|orig|save|swp|env|sql|log|ini|conf|sh|md|yml|yaml)$">
    Require all denied
</FilesMatch>

# 4. Block Direct Access to Internal App Directories
<Directory "/app/config">
    Require all denied
</Directory>

<Directory "/app/templates">
    Require all denied
</Directory>

# 5. API Directory Alias Configuration
Alias /api /app/api

<Directory "/app/api">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Cegah eksekusi atau download file selain PHP di folder API
    <FilesMatch "(?i)\.(bak|old|save|swp|txt|json|sql|log|md|sh)$">
        Require all denied
    </FilesMatch>

    # Delegasi eksekusi file PHP ke PHP-FPM FastCGI proxy
    <FilesMatch "\.php$">
        <If "-f %{REQUEST_FILENAME}">
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </If>
    </FilesMatch>
</Directory>

# 6. Public DocumentRoot Configuration
<Directory "/app/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
