services:
  pantau:
    container_name: pantau-audit
    image: webdevops/php-apache:8.3

    # Opsi jika ingin build dari Dockerfile lokal:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    ports:
      - "8082:80"

    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - WEB_DOCUMENT_INDEX=index.php
      - PHP_DATE_TIMEZONE=Asia/Jakarta
      # Security Hardening: sembunyikan info PHP & jangan tampilkan error ke output browser
      - PHP_DISPLAY_ERRORS=0
      - PHP_EXPOSE_PHP=0

    volumes:
      - ./app:/app
      - ./docker/vhost-pantau.conf:/opt/docker/etc/httpd/vhost.common.d/pantau.conf:ro

    env_file:
      - app/.env

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - pantau-network

networks:
  pantau-network:
    driver: bridge
